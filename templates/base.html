<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FitBuddy{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>
<body>
<header class="topbar">
    <a class="brand" href="/">Fit<span>Buddy</span></a>
    <nav>
        <a href="/">Home</a>
        <a href="/view-all-users">Users</a>
        <a href="/docs">API Docs</a>
    </nav>
</header>

<main class="page-shell">
    {% block content %}{% endblock %}
</main>

<footer class="footer">
    <p>FitBuddy · AI Fitness Plan Generator</p>
    <p class="muted">General wellness project — not medical advice.</p>
</footer>

<script src="{{ url_for('static', path='js/app.js') }}"></script>
</body>
</html>
